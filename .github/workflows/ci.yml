name: CI

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check for Swift changes
        id: filter
        run: |
          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only --repo ${{ github.repository }})
          if echo "$CHANGED" | grep -qE '\.(swift)$|^Package\.swift$'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        if: steps.filter.outputs.swift == 'true'
        run: swift build -c release

      # Rewrite consent may only be granted by the disclosure sheet (Task 5.1).
      # Until then a release binary must contain no code that writes it.
      - name: Release binary cannot grant rewrite consent
        if: steps.filter.outputs.swift == 'true'
        run: |
          BIN=.build/release/open-wispr
          SYMBOLS=$(nm "$BIN" | grep -c recordAcceptance || true)
          STRINGS=$(strings "$BIN" | grep -ci 'rewrite consent' || true)
          echo "recordAcceptance symbols: $SYMBOLS, dev consent strings: $STRINGS"
          test "$SYMBOLS" = "0" && test "$STRINGS" = "0"

  worker-config-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The dev-only mock LLM must never be configured on the deployed Worker.
      - name: LLM_PROVIDER is not set in wrangler.toml
        run: |
          if grep -n "LLM_PROVIDER" backend/proxy/wrangler.toml; then
            echo "LLM_PROVIDER must not appear in wrangler.toml (dev-only mock switch)"
            exit 1
          fi

  # Proxy tests run in real workerd (via @cloudflare/vitest-pool-workers) against
  # mocked Supabase and Anthropic; no accounts or keys are involved.
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend/proxy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/proxy/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  unit-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check for Swift changes
        id: filter
        run: |
          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only --repo ${{ github.repository }})
          if echo "$CHANGED" | grep -qE '\.(swift)$|^Package\.swift$'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Unit tests
        if: steps.filter.outputs.swift == 'true'
        run: swift test

  install-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Install smoke test
        run: bash scripts/test-install.sh

  transcription-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install whisper-cpp
        run: brew install whisper-cpp

      - name: Build
        run: swift build -c release

      - name: Transcription integration test
        run: bash scripts/test-transcription.sh
