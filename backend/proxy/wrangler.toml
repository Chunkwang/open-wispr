name = "open-wispr-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Per-user quota counters. One QuotaCounter Durable Object per user id; it stores
# usage counts only (SQLite-backed). The migration creates the class on first deploy.
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]

[vars]
SUPABASE_URL = "REPLACE_WITH_SUPABASE_PROJECT_URL"
# How the Worker verifies Supabase access tokens: "hs256" (shared SUPABASE_JWT_SECRET, the legacy
# default) or "jwks" (asymmetric ES256/RS256 keys fetched from the project's JWKS endpoint; then
# SUPABASE_JWT_SECRET is not needed). Any other value makes the Worker answer 500 misconfigured.
# Day 16: set this to match the real project's signing-key setting.
JWT_VERIFY_MODE = "hs256"
# The one Pro plan Checkout Sessions are created for. Not secret, but must not stay
# "price_placeholder" here: the Worker refuses to serve /v1/billing/* and the webhook off
# loopback while it does (see hostGuard.ts).
STRIPE_PRICE_ID = "REPLACE_WITH_STRIPE_PRICE_ID"
# Where Checkout/the billing portal send the browser back once a real domain exists (D1).
# Optional: unset falls back to a placeholder example.com page (billing.ts).
# BILLING_SUCCESS_URL = "https://REPLACE_WITH_REAL_DOMAIN/billing/success"
# BILLING_CANCEL_URL = "https://REPLACE_WITH_REAL_DOMAIN/billing/cancel"
# BILLING_PORTAL_RETURN_URL = "https://REPLACE_WITH_REAL_DOMAIN/billing/success"
# STRIPE_API_BASE_URL must NEVER be set here: it exists only for .dev.vars (local mock Stripe),
# and stripeClient.ts refuses to honor it off loopback even if it were.

# Secrets (never committed) — set with:
#   wrangler secret put SUPABASE_JWT_SECRET
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
