name = "open-wispr-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Create with: wrangler kv namespace create RATE_LIMIT_KV
# then paste the returned id below.
kv_namespaces = [
  { binding = "RATE_LIMIT_KV", id = "REPLACE_WITH_KV_NAMESPACE_ID" }
]

[vars]
SUPABASE_URL = "REPLACE_WITH_SUPABASE_PROJECT_URL"

# Secrets (never committed) — set with:
#   wrangler secret put SUPABASE_JWT_SECRET
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
